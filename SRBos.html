<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d2f">
<title>SRB CARGO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --acc:#12805C;--acc2:#0EA470;--accbg:#e3f3ec;--acc3:#0f3d2f;
  --red:#d64242;--red2:#b83333;--redbg:#fdecec;
  --jade:#12805C;--jadebg:#e3f3ec;
  --amber:#c27a0a;--amberbg:#fdf3df;
  --blue:#2f6fd6;--bluebg:#e8f0fd;
  --vio:#7a4fd0;--viobg:#f0eafc;
  --ink:#10201a;--ink2:#37463f;--ink3:#6a7a72;--ink4:#9aa8a1;
  --bg:#f3f6f4;--paper:#ffffff;--paper2:#f5f8f6;--line:#e1e8e4;--line2:#cfdad4;
  --shadow:0 1px 2px rgba(16,32,26,.04),0 8px 28px -16px rgba(16,32,26,.22);
  --r:16px;--side:248px;
  --fd:"Onest",system-ui,sans-serif;--fb:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fm:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
[data-theme=dark]{
  --acc:#2FA06E;--acc2:#5FD39A;--accbg:#143528;--acc3:#0a2a20;
  --redbg:#3a1a1a;--jade:#3fbf88;--jadebg:#143528;--amber:#e5a23a;--amberbg:#3a2a10;--blue:#6c9bff;--bluebg:#172447;--vio:#a487ea;--viobg:#2a1f45;
  --ink:#eaf2ee;--ink2:#c3d0c9;--ink3:#8fa098;--ink4:#64746c;
  --bg:#0c1411;--paper:#121c18;--paper2:#17231e;--line:#22312a;--line2:#2f4038;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.45 var(--fb);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.mono{font-family:var(--fm);font-feature-settings:"zero" 0;letter-spacing:-.02em}
.mut{color:var(--ink3)}.mut2{color:var(--ink4)}
.hide{display:none!important}
.r{margin-left:auto}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.num{text-align:right;font-family:var(--fm);white-space:nowrap}

/* ---------- печать-логотип ---------- */
.seal{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;display:grid;place-items:center;font:800 12.5px/1 var(--fd);letter-spacing:.03em;flex:none;
  box-shadow:0 6px 16px -6px color-mix(in srgb,var(--acc) 70%,transparent)}
.brand{display:flex;align-items:center;gap:11px}
.brand b{font:800 15.5px/1 var(--fd);letter-spacing:-.01em}
.brand small{display:block;font-size:10.5px;color:var(--ink3);letter-spacing:.14em;margin-top:4px;text-transform:uppercase}

/* ---------- кнопки, поля ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;padding:9px 16px;font-weight:700;font-size:13.5px;cursor:pointer;
  background:var(--ink);color:var(--paper);transition:transform .08s,background .15s,opacity .15s;white-space:nowrap;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.red{background:var(--red);color:#fff}.btn.red:hover{background:var(--red2)}
.btn.pri{background:var(--acc);color:#fff}.btn.pri:hover{background:color-mix(in srgb,var(--acc) 85%,#000)}
.btn.jade{background:var(--jade);color:#fff}
.btn.g{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn.g:hover{background:var(--paper2)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.xs{padding:3px 8px;font-size:11.5px;border-radius:7px}
.btn.wa{background:#1fae5b;color:#fff}
.btn svg{width:16px;height:16px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:11.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.in,.fld input,.fld select,.fld textarea{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;transition:border .15s,box-shadow .15s}
.in:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 14%,transparent)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:0 11px;min-width:220px}
.search input{border:0;outline:0;background:transparent;padding:9px 0;width:100%}
.search svg{width:16px;height:16px;color:var(--ink4)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--acc);cursor:pointer}
.ed{width:74px;border:1.5px solid var(--line);border-radius:8px;padding:4px 7px;background:var(--paper);text-align:right;font-family:var(--fm);outline:none}
.ed:focus{border-color:var(--ink3)}

/* ---------- метки ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--paper2);color:var(--ink2)}
.tag.red{background:var(--redbg);color:var(--red)}.tag.jade{background:var(--jadebg);color:var(--jade)}.tag.amber{background:var(--amberbg);color:var(--amber)}
.tag.blue{background:var(--bluebg);color:var(--blue)}.tag.vio{background:var(--viobg);color:var(--vio)}
.tag i{width:6px;height:6px;border-radius:50%;background:currentColor}
.code{font:600 12.5px var(--fm);padding:2px 7px;border-radius:6px;background:var(--paper2);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap;cursor:pointer}
.code.ag{background:var(--viobg);color:var(--vio);box-shadow:none}

/* ---------- раскладка ---------- */
#app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
#side{position:sticky;top:0;height:100vh;overflow:auto;padding:20px 14px;background:var(--acc3);color:#e6f1ec;display:flex;flex-direction:column;gap:20px}
#side .brand small{color:#8fb8a6}
#navs{display:flex;flex-direction:column;gap:16px}
.navg{display:flex;flex-direction:column;gap:2px}
.nav .cnt:empty{display:none}
#side .chip{background:rgba(255,255,255,.08);box-shadow:none;color:#cfe2d9}
.kpi[data-go-st]:before{display:none}
.navh{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7fa898;padding:0 10px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;border:0;background:none;cursor:pointer;font-weight:600;color:#cfe2d9;text-align:left;width:100%}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:#fff;color:var(--acc3)}
.nav svg{width:18px;height:18px;flex:none;opacity:.85}
.nav .cnt{margin-left:auto;font:600 11px var(--fm);padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.1);color:#cfe2d9}
.nav.on .cnt{background:var(--accbg);color:var(--acc)}
.nav .cnt.hot{background:var(--red);color:#fff}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.07)}
.me .mut{color:#8fb8a6}
#side .x{background:rgba(255,255,255,.08);box-shadow:none;color:#e6f1ec}
.av{width:34px;height:34px;border-radius:50%;background:var(--acc2);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
#main{min-width:0;padding:22px 28px 60px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font:800 26px/1.15 var(--fd);letter-spacing:-.025em}
.crumb{font-size:12px;color:var(--acc);font-weight:700;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--ink4)}
.chip.ok i{background:var(--jade)}.chip.bad i{background:var(--red)}.chip.busy i{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.page{display:none;animation:fade .25s}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}

/* ---------- карточки ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.ch{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ch h3{font:700 16px/1.25 var(--fd);letter-spacing:-.01em}
.ch .cs{font-size:12.5px;color:var(--ink3);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.kpi .l{font-size:12.5px;font-weight:600;color:var(--ink3)}
.kpi .v{font:800 26px/1.1 var(--fd);margin-top:8px;letter-spacing:-.03em}
.kpi .v small{font:600 12px var(--fb);color:var(--ink3);margin-left:4px;letter-spacing:0}
.kpi .d{font-size:12px;color:var(--ink3);margin-top:4px}
.kpi.red .v{color:var(--red)}.kpi.jade .v{color:var(--jade)}
.kpi:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--line2)}
.kpi.red:before{background:var(--red)}.kpi.jade:before{background:var(--acc)}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--line2)}

/* ---------- таблицы ---------- */
.tw{overflow:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--ink3);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--paper)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--paper2)}
tr.sel td{background:color-mix(in srgb,var(--acc) 8%,transparent)}
th.num,td.num{text-align:right}
tfoot td{font-weight:800;border-bottom:0;border-top:1.5px solid var(--line)}
.empty{padding:40px 16px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink);font:700 16px var(--fd);margin-bottom:6px}
.empty .gl{width:56px;height:56px;border-radius:18px;background:var(--accbg);color:var(--acc);display:grid;place-items:center;margin:0 auto 12px}

/* ---------- маршрут груза ---------- */
.route{display:inline-flex;align-items:center;gap:0}
.route i{width:9px;height:9px;border-radius:50%;background:var(--line2);position:relative}
.route i+i{margin-left:12px}
.route i+i:before{content:"";position:absolute;right:9px;top:3.5px;width:12px;height:2px;background:var(--line2)}
.route i.on{background:var(--acc)}
.route i.on:before{background:var(--acc)}
.route i.now{background:var(--acc2);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc2) 30%,transparent)}
.route i.now:before{background:var(--acc)}
.route i.done{background:var(--ink3)}.route i.done:before{background:var(--ink3)}
.stl{font-size:12px;font-weight:700;margin-left:8px}

/* ---------- фильтры-чипы ---------- */
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fc{border:0;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink2)}
.fc b{font-family:var(--fm);font-weight:600;margin-left:5px;color:var(--ink3)}
.fc.on{background:var(--acc);color:#fff;box-shadow:none}.fc.on b{color:inherit;opacity:.7}

/* ---------- выдвижная панель ---------- */
#scrim{position:fixed;inset:0;background:rgba(15,16,20,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;backdrop-filter:blur(2px)}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;transform:translateX(102%);transition:transform .25s cubic-bezier(.3,.7,.2,1);overflow:auto;box-shadow:-20px 0 60px -20px rgba(0,0,0,.3)}
#drawer.on{transform:none}
.dh{position:sticky;top:0;z-index:2;background:var(--bg);padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h2{font:800 21px/1.2 var(--fd);letter-spacing:-.02em}
.db{padding:16px 20px 40px;display:flex;flex-direction:column;gap:14px}
.x{border:0;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:18px;flex:none}
.tabs{display:flex;gap:4px;background:var(--paper2);padding:4px;border-radius:11px;width:max-content;max-width:100%;overflow:auto}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--ink3);white-space:nowrap}
.tabs button.on{background:var(--paper);color:var(--acc);box-shadow:var(--shadow)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13.5px}
.kv dt{color:var(--ink3)}.kv dd{font-weight:600;text-align:right}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat3>div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.stat3 .l{font-size:12px;font-weight:600;color:var(--ink3)}
.stat3 .v{font:800 19px var(--fd);margin-top:4px;letter-spacing:-.02em}

/* ---------- модалка, тост ---------- */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,16,20,.5);backdrop-filter:blur(3px)}
#modal.on{display:flex}
.mbox{background:var(--paper);border-radius:18px;padding:22px;width:min(480px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.mbox h3{font:800 19px var(--fd);margin-bottom:6px}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);pointer-events:auto;display:flex;gap:12px;align-items:center;max-width:92vw;animation:fade .2s}
.toast button{background:var(--acc2);color:#fff;border:0;border-radius:8px;padding:5px 10px;font-weight:700;cursor:pointer}

/* ---------- загрузка ---------- */
.drop{border:2px dashed var(--line2);border-radius:18px;padding:34px 20px;text-align:center;background:var(--paper2);transition:all .15s;cursor:pointer;position:relative;overflow:hidden}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--accbg)}
.drop .gl{width:64px;height:64px;border-radius:20px;background:var(--paper);color:var(--acc);display:grid;place-items:center;margin:0 auto;box-shadow:var(--shadow)}
.drop h3{font:800 19px var(--fd);margin:14px 0 6px}
.frep{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--paper)}
.frep+.frep{margin-top:10px}
details summary{cursor:pointer;font-size:12.5px;color:var(--ink3);font-weight:600}
details[open] summary{margin-bottom:6px}
.det{font-size:12px;color:var(--ink3);max-height:260px;overflow:auto;line-height:1.6}

/* ---------- вход ---------- */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px;
  background:radial-gradient(900px 500px at 15% -10%,color-mix(in srgb,var(--acc2) 22%,transparent),transparent 60%),radial-gradient(700px 500px at 110% 110%,color-mix(in srgb,var(--acc) 18%,transparent),transparent 60%),var(--bg)}
.lcard{width:min(420px,100%);background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 30px 70px -30px rgba(16,32,26,.35);display:flex;flex-direction:column;gap:14px}
.lcard h2{font:800 24px var(--fd);letter-spacing:-.02em}
.ltrack{width:min(640px,100%);margin-top:26px}
.ltrack svg{width:100%;height:auto;display:block}
.lfoot{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--ink3)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--paper2);border-radius:12px;padding:4px}
.seg button{border:0;background:none;padding:9px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--ink3)}
.seg button.on{background:var(--paper);color:var(--acc);box-shadow:var(--shadow)}
.err{color:var(--red);font-size:13px;font-weight:600;min-height:18px}
/* ---------- калькулятор ---------- */
.calc{display:grid;grid-template-columns:1.15fr 1fr;gap:14px}
.cls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cls button{border:0;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:12px;padding:10px;text-align:left;cursor:pointer}
.cls button b{display:block;font:700 15px var(--fd)}
.cls button span{font-size:11.5px;color:var(--ink3);line-height:1.3;display:block;margin-top:3px}
.cls button.on{box-shadow:inset 0 0 0 2px var(--acc);background:var(--accbg)}
.meter{height:10px;border-radius:99px;background:linear-gradient(90deg,#bfe6d4,#12805C);position:relative;margin:14px 0 6px}
.meter i{position:absolute;top:-5px;width:4px;height:20px;border-radius:3px;background:var(--ink);transform:translateX(-50%);transition:left .3s}
.price{font:800 48px/1 var(--fd);letter-spacing:-.04em}
.price small{font:600 15px var(--fb);color:var(--ink3);letter-spacing:0}

/* ---------- кабинет ---------- */
#cab{max-width:860px;margin:0 auto;padding:20px 16px 50px}
.parcel{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.parcel+.parcel{margin-top:8px}

/* ---------- график ---------- */
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bars .s{width:100%;max-width:46px;display:flex;flex-direction:column-reverse;border-radius:7px 7px 3px 3px;overflow:hidden;background:var(--paper2)}
.bars .s i{display:block}
.bars .lab{font-size:11px;color:var(--ink3);font-weight:700}
.bars .val{font:600 11px var(--fm);color:var(--ink2)}
.todo{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border:0}
.todo .gl{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--paper2);flex:none}
.todo .gl svg{width:18px;height:18px}
.todo .gl.red{background:var(--redbg);color:var(--red)}.todo .gl.amber{background:var(--amberbg);color:var(--amber)}.todo .gl.jade{background:var(--jadebg);color:var(--jade)}.todo .gl.blue{background:var(--bluebg);color:var(--blue)}

#bulk{position:fixed;bottom:16px;left:calc(var(--side) + 28px);right:28px;z-index:30;background:var(--acc3);color:var(--paper);border-radius:14px;padding:10px 14px;display:none;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
#bulk.on{display:flex}
#bulk select{background:rgba(255,255,255,.1);border:0;border-radius:8px;padding:6px 8px;color:inherit}
#bulk select option{color:#000}
#bulk .btn.g{color:var(--paper);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)}
.mtop{display:none}

/* ---------- телефон ---------- */
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 auto 0 0;width:270px;z-index:50;transform:translateX(-102%);transition:transform .25s}
  #side.on{transform:none}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--line)}
  #main{padding:16px 14px 90px}

/* Подклиент агента из номера: убираем YW-, код агента, хвост -ММДД-местаБуква */
function agentSub(raw,agent){
  var s=String(raw||"").trim().toUpperCase().replace(/\s+/g,"").replace(/^YW[-_]?/,"");
  var A=String(agent||"").toUpperCase();
  if(A&&s.indexOf(A)===0)s=s.slice(A.length);
  var parts=s.split(/[-_]+/).filter(Boolean),pcsN=0,mmdd="";
  if(parts.length){var m=parts[parts.length-1].match(/^(\d+)([A-Z]*)$/);if(m&&(parts.length>1||m[2])){pcsN=+m[1];parts.pop()}}

  else if(parts.length===1&&/^\d{4}$/.test(parts[0])&&pcsN){mmdd=parts.pop()}

/* Разбор счёта бухгалтера. Поддерживает:
   · один лист (старый формат: SRB11.12, AWA11.12);
   · книгу «лист = код»: SRB (ваш, цена = себестоимость) и листы агентов (ED88, KURS, SM, PL, ONE, AWA…)
     с колонками «агентская цена / агентская сумма / 代收款 возврат»;
   · строки-продолжения без номера накладной — это места той же накладной, складываются в неё. */
function parseBill(wb,own,agents){
  own=String(own||"SRB").toUpperCase();
  var out={rows:[],own:0,agent:0,sheets:0,bySheet:[]};
  wb.SheetNames.forEach(function(nm){
    var ws=wb.Sheets[nm];if(!ws||!ws["!ref"])return;
    var A=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true,blankrows:true});
    var hi=isBillSheet(A);if(hi<0)return;
    out.sheets++;
    var H=A[hi].map(function(x){return String(x==null?"":x)});
    // двухэтажная шапка (китайский сверху, русский снизу) — склеиваем, данные начинаются ниже
    var start=hi+1,nx=A[hi+1]||[];
    if(nx.some(function(x){return String(x).trim()})&&!nx.some(function(x){return typeof x==="number"})&&!String(nx[hdrCol(H,BILL_ID)]||"").match(/\d/)){
      H=H.map(function(h,i){return h+" "+String(nx[i]==null?"":nx[i])});start=hi+2;
    }
    var AG=/агент|агенст|agent/;
    var c={date:hdrCol(H,["发货日期","日期","дата","date"]),id:hdrCol(H,BILL_ID),pcs:hdrCol(H,["包数","件数","箱数","к-во мест","кол-во мест","мест","places","pcs","ctn"]),
      w:hdrCol(H,["总重量","重量","вес","weight","kg","кг"],/цен|单价|price|сумм/),m3:hdrCol(H,["总立方","立方","体积","方数","куб","объем","объём","cbm","m3","м3"],/цен|单价|price|сумм/),
      price:hdrCol(H,["单价","цена","тариф","price","rate"],AG),
      pack:hdrCol(H,["包装","打包","упаков","packing"]),adv:hdrCol(H,["垫付","аванс","advance"]),
      tot:hdrCol(H,["应付","итого","总金额","金额","сумма","total","amount"],AG),
      cli:hdrCol(H,["客户","唛头","имя клиента","клиент","client"]),cls:hdrCol(H,["类别","密度","класс","категор"]),dest:hdrCol(H,["目的地","назнач"]),
      agP:hdrCol(H,["агентская цена","агенсткая цена","agent price"]),agS:hdrCol(H,["агентская сумма","агенсткая сумма","agent sum"]),
      agR:hdrCol(H,["代收款","возврат"])};
    if(c.id<0||c.w<0)return;
    var code=String(nm).trim().toUpperCase().replace(/\s+/g,"");
    var hasAg=c.agP>-1;
    // тип листа: лист агента (есть «агентская цена»), ваш лист (имя = префикс) или старый одиночный лист
    var kind=hasAg?"agent":(code===own?"own":"auto");
    var agentCode=hasAg&&/^[A-Z][A-Z0-9]{1,9}$/.test(code)&&code!==own?code:"";
    var colW=c.w>-1?XLSX.utils.encode_col(c.w):"D",colM=c.m3>-1?XLSX.utils.encode_col(c.m3):"E";
    var dest="",last=null,seen={},stat={sheet:nm,code:agentCode||(kind==="own"?own:""),kind:kind,n:0,parts:0};
    for(var r=start;r<A.length;r++){
      var R=A[r];var id=String(c.id>-1?R[c.id]:"").trim();
      var hasW=R[c.w]!==""&&R[c.w]!=null&&!isNaN(numX(R[c.w]))&&numX(R[c.w])>0;
      if(/合计|итого|备注|примечан/i.test(id)||/合计/.test(String(R[c.pcs]||"")))continue;
      if(R.some(function(x){return typeof x==="string"&&/^\s*(合计|总计|小计|итого|всего|total|сумма итого)\s*:?\s*$/i.test(x)}))continue; // строка итогов в любой колонке
      if(!id&&!hasW)continue;
      var w=numX(R[c.w]),m3=numX(R[c.m3]);

      var mode="";

        else if(f&&new RegExp("(^|[^A-Z])"+colW+"\\d").test(f))mode="kg";
        else mode=price>=10?"m3":"kg";
      }

      var bill=tc&&typeof tc.v==="number"?tc.v:(qty*price+pk+ad);
      var agP=hasAg?numX(R[c.agP]):0;
      var sc=cellVal(ws,r,c.agS),agS=hasAg?(sc&&typeof sc.v==="number"?sc.v:(agP>0?qty*agP+pk:0)):0;
      var rc=cellVal(ws,r,c.agR),agR=hasAg?(rc&&typeof rc.v==="number"?rc.v:bill-agS):0;
      var pcs=parseInt(numX(R[c.pcs]),10)||0;
      if(!id){ // продолжение накладной: ещё места той же накладной
        if(!last)continue;
        last.pcs+=pcs||1;last.w+=w;last.m3+=m3;last.pack+=pk;last.adv+=ad;last.bill+=bill;last.agSum+=agS;last.agRet+=agR;last.parts++;
        if(price&&last.price&&price!==last.price)last.mixed=1;

      }
      if(c.dest>-1&&String(R[c.dest]).trim())dest=String(R[c.dest]).trim();
      var k=parseClsX(c.cls>-1?R[c.cls]:"");

        var e=seen[wbId];e.pcs+=pcs;e.w+=w;e.m3+=m3;e.pack+=pk;e.adv+=ad;e.bill+=bill;e.agSum+=agS;e.agRet+=agR;e.parts++;e.dup=(e.dup||1)+1;last=e;continue;

      }else{

      }
      var row={wb:wbId,date:xlDateX(R[c.date]),pcs:pcs,w:w,m3:m3,price:price,mode:mode,pack:pk,adv:ad,bill:bill,
        agPrice:agP,agSum:agS,agRet:agR,hasAg:hasAg?1:0,sheet:nm,parts:1,
        cat:k.cat,clsRaw:k.raw,dens:k.dens,jcol:jcol,dest:dest,
        own:p.own,client:p.client,agent:p.agent,sub:p.sub,subName:p.subName,mmdd:p.mmdd,pcsN:p.pcsN,ownRow:p.isOwnFile,odd:p.odd?1:0,
        src:kind==="agent"?"agent":(kind==="own"?"own":"")};

function billWarnings(x){

  if(x.odd)w.push("Номер без кода клиента («"+x.wb+"») — назначьте клиента или агента");
  else if(x.own)w.push("Нет кода клиента — это ваш груз, назначьте клиента при необходимости");
  if(!x.cat)w.push(x.clsRaw?"Класс «"+x.clsRaw+"» не распознан — стоит 1-я категория":"Класс груза не указан (только плотность) — стоит 1-я категория");
  var real=x.m3>0?x.w/x.m3:0;
  if(x.parts===1&&real&&x.dens>0&&Math.abs(real-x.dens)/real>0.05)w.push("Плотность в счёте "+x.dens+", по весу/объёму "+Math.round(real));

    r.nakl++;r.pcs+=+c.pcs||0;r.kg+=+c.w||0;r.m3+=+c.m3||0;r.cost_usd+=c._cost;r.bill_usd+=c._rev;r.profit_usd+=c._prof;if(c.sentAt)r.sent_som+=c._som});
  S.fin.forEach(function(f){if(f.t!=="in"||!f.k)return;var ym=ymOf(f.d)||"без даты",k=ym+"|"+f.k;
    var r=R[k]||(R[k]={month:ym,code:f.k,name:cname(f.k),type:isAg(f.k)?"агент":"клиент",nakl:0,pcs:0,kg:0,m3:0,cost_usd:0,bill_usd:0,profit_usd:0,sent_som:0,paid_som:0});r.paid_som+=+f.s||0});
  return Object.keys(R).sort().reverse().map(function(k){var r=R[k];["kg","m3","cost_usd","bill_usd","profit_usd"].forEach(function(f){r[f]=r2(r[f])});
    r.sent_som=Math.round(r.sent_som);r.paid_som=Math.round(r.paid_som);return r});
}

/* ================= ЗАГРУЗКА ФАЙЛОВ =================
   Любой файл: xlsx/xls/ods/csv/txt. Система сама ищет на каждом листе счёт бухгалтера
   (номер накладной + вес) и/или список клиентов (код + имя/телефон, даже без шапки).
   Ничего не считается «ошибкой»: всё загружается, замечания — в «Подробностях». */
function readBook(buf,name){
  var u=new Uint8Array(buf),txt=/\.(csv|tsv|txt)$/i.test(name||"");
  if(!txt){try{return XLSX.read(u,{type:"array",cellFormula:true,cellDates:false})}catch(e){}}
  var t;try{t=new TextDecoder("utf-8",{fatal:true}).decode(u)}catch(e){t=new TextDecoder("windows-1251").decode(u)}
  t=t.replace(/^﻿/,"");
  var first=t.split(/\r?\n/)[0]||"",sep=[";","\t",","].sort(function(a,b){return first.split(b).length-first.split(a).length})[0];
  var rows=t.split(/\r?\n/).map(function(l){return l.split(sep).map(function(x){x=x.replace(/^"|"$/g,"").trim();return x!==""&&/^-?\d+([.,]\d+)?$/.test(x)?numX(x):x})});
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),String(name||"Лист").replace(/\.[^.]+$/,"").slice(0,28)||"Лист");
  return wb;
}
function rowsOf(wb,n){var ws=wb.Sheets[n];if(!ws||!ws["!ref"])return [];return XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true,blankrows:false})}
/* ---------- справочник клиентов ---------- */
function isCodeHead(h){h=String(h).toLowerCase().trim();return h==="код"||h==="code"||h==="kod"||h==="шифр"||h==="唛头"||/код клиента|client code|客户代码|客户编号|^код\b/.test(h)}
function cliHeader(rows){
  for(var i=0;i<Math.min(30,rows.length);i++){var H=rows[i].map(function(x){return String(x).toLowerCase().trim()});
    if(H.some(isCodeHead)&&H.some(function(h){return /имя|name|телефон|phone|тел\b|тел\.|фио|whatsapp|ватсап|номер|电话|姓名|客户名/.test(h)}))return i}
  return -1;
}
var CODE_RE=/^[A-Z]{2,6}[-\s]?\d{1,4}[A-Z]?$/;
function sniffClients(rows){
  var n=Math.min(rows.length,300),cols=0;rows.slice(0,n).forEach(function(r){cols=Math.max(cols,r.length)});
  var sc=[];for(var c=0;c<cols;c++){var ne=0,cd=0,ph=0,tx=0;
    for(var i=0;i<n;i++){var v=String(rows[i][c]==null?"":rows[i][c]).trim();if(!v)continue;ne++;
      if(CODE_RE.test(v.toUpperCase()))cd++;var d=v.replace(/\D/g,"");if(d.length>=9&&d.length<=13&&!/[a-zа-я]/i.test(v))ph++;
      if(/^[A-Za-zА-Яа-яЁё][A-Za-zА-Яа-яЁё .'-]+$/.test(v)&&!CODE_RE.test(v.toUpperCase()))tx++}
    sc.push({c:c,ne:ne,cd:cd,ph:ph,tx:tx})}
  var pick=function(f,not){var b=-1;sc.forEach(function(x){if(not.indexOf(x.c)<0&&x.ne>=2&&x[f]/x.ne>=0.6&&(b<0||x[f]>sc[b][f]))b=x.c});return b};
  var code=pick("cd",[]);if(code<0||sc[code].ne<3)return null;
  var ph=pick("ph",[code]),nm=pick("tx",[code,ph]);
  return ph<0&&nm<0?null:{code:code,ph:ph,name:nm};
}
function colOf(head,words){for(var w=0;w<words.length;w++)for(var i=0;i<head.length;i++)if(head[i].indexOf(words[w])>-1)return i;return -1}
function parseClientSheets(wb,skip){
  var out=[],info=[];
  wb.SheetNames.forEach(function(nm){
    if(skip&&skip[nm])return;
    var rows=rowsOf(wb,nm),hi=cliHeader(rows),cc,cn=-1,cp=-1,cnote=-1,ccity=-1;
    if(hi>-1){var H=rows[hi].map(function(x){return String(x).toLowerCase().trim()});
      cc=H.findIndex(isCodeHead);cn=colOf(H,["имя","фио","name","姓名","客户名"]);cp=colOf(H,["телефон","phone","тел","whatsapp","ватсап","电话","номер"]);
      cnote=colOf(H,["примеч","заметк","коммент","note"]);ccity=colOf(H,["город","city"])}
    else{var sn=sniffClients(rows);if(!sn)return;cc=sn.code;cp=sn.ph;cn=sn.name}
    rows.slice(hi+1).forEach(function(r,i){
      var code=normCode(r[cc]),name=cn>-1?String(r[cn]==null?"":r[cn]).trim():"";
      if(!code||!/\d|^[A-Z]{2,}$/.test(code)){if(name)info.push("строка "+(hi+i+2)+": «"+name+"» без кода — пропущена");return}
      var praw=cp>-1?String(r[cp]==null?"":r[cp]).trim():"",px=normPhoneX(praw);
      if(px.fix)info.push(code+": телефон исправлен "+praw+" → "+px.p+" ("+px.fix+")");
      else if(praw&&!px.p)info.push(code+": в поле телефона «"+praw+"» — номер не найден");
      out.push({code:code,name:name,phone:px.p,note:cnote>-1?String(r[cnote]||"").trim():"",city:ccity>-1?String(r[ccity]||"").trim():""});
    });
  });
  return {list:out,info:info};
}
function mergeClients(list,rep){
  list.forEach(function(x){
    var ex=cliOf(x.code);
    if(!ex){add("clients",{code:x.code,name:x.name,phone:x.phone,type:x.code===PREF()?"own":"client",city:x.city||"",note:x.note||"",mkK:"",mkM:"",agK:"",ph:"",since:today()},true);rep.cliNew++;return}
    var p={};if(x.name&&x.name!==ex.name)p.name=x.name;if(x.phone&&x.phone!==ex.phone)p.phone=x.phone;if(x.city&&!ex.city)p.city=x.city;if(x.note&&!ex.note)p.note=x.note;
    if(Object.keys(p).length){upd("clients",ex,p,true);rep.cliUpd++}
  });
}
/* ---------- счёт бухгалтера ---------- */
var BILL_F=["date","pcs","w","m3","cat","dens","clsRaw","price","mode","pack","adv","bill","agPrice","agSum","agRet","hasAg","sheet","sub","subName","dest"];
function ensureClient(code,type){
  var k=cliOf(code);
  if(!k)return add("clients",{code:code,name:code===PREF()?"Свой груз":"",phone:"",type:type,city:"",note:"",mkK:"",mkM:"",agK:"",ph:"",since:today()},true);
  if(type==="agent"&&k.type!=="agent")upd("clients",k,{type:"agent"},true);
  return k;
}
function billImport(wb,fname,rep){
  var agents=S.clients.filter(function(c){return c.type==="agent"}).map(function(c){return c.code});
  var o=parseBill(wb,PREF(),agents);
  if(!o.rows.length)return false;
  rep.kind="bill";rep.sheets=o.bySheet.map(function(s){return s.sheet});
  var fx=S.files.find(function(f){return f.name===fname}),fid=fx?fx.id:uid("f");rep.fid=fid;
  if(fx)upd("files",fx,{at:nowISO(),n:o.rows.length},true);else add("files",{id:fid,name:fname,at:nowISO(),n:o.rows.length,src:o.src},true);
  o.rows.forEach(function(r){
    var code,type;
    if(r.hasAg){code=normCode(r.agent);type="agent"}
    else if(r.own||r.ownRow&&r.client){code=normCode(r.client||PREF());type=code===PREF()?"own":"client"}
    else if(r.client){code=normCode(r.client);type="client"}
    else{code=normCode(r.agent)||PREF();type=code===PREF()?"own":"agent"}
    ensureClient(code,type);
    var rc=rep.codes[code]||(rep.codes[code]={code:code,type:type,n:0,pcs:0,kg:0,bill:0});
    rc.n++;rc.pcs+=r.pcs;rc.kg+=r.w;rc.bill+=+r.agSum>0?+r.agSum:+r.bill||0;
    rep.pcs+=r.pcs;rep.kg+=r.w;rep.sum+=+r.bill||0;
    (r.warn||[]).forEach(function(w){rep.info.push(r.wb+" — "+w)});
    var ex=find("cargo",r.wb);
    var vals={};BILL_F.forEach(function(f){vals[f]=r[f]==null?"":r[f]});vals.cat=r.cat||1;vals.warn=(r.warn||[]).join(" | ");
    if(!ex){
      add("cargo",Object.assign({id:r.wb,wb:r.wb,code:code,file:fid,st:"В пути",trip:"",recv:0,recvPcs:"",wh:"",sentAt:"",sentRate:"",sentUsd:"",sentSom:"",
        issuedAt:"",issuedBy:"",issuedTo:"",issuedPcs:"",issueNote:"",note:"",svc:0,sell:""},vals),true);
      rep.n++;
    }else{
      if(ex.catManual)delete vals.cat;vals.file=fid;
      var before=JSON.stringify(BILL_F.map(function(f){return String(ex[f]==null?"":ex[f])}));
      upd("cargo",ex,vals,true);
      var after=JSON.stringify(BILL_F.map(function(f){return String(ex[f]==null?"":ex[f])}));
      if(before!==after){rep.upd++;if(ex.sentAt)rep.info.unshift(r.wb+" — изменился после отправки клиенту: проверьте и отправьте накладную заново")}
      else rep.same++;
    }
  });
  return true;
}
function importBook(wb,fname){
  var rep={name:fname,kind:"skip",codes:{},sheets:[],n:0,upd:0,same:0,cliNew:0,cliUpd:0,pcs:0,kg:0,sum:0,info:[]};
  var billSheets={};wb.SheetNames.forEach(function(nm){var A=rowsOf(wb,nm);if(isBillSheet(A)>-1)billSheets[nm]=1});
  var hasBill=Object.keys(billSheets).length&&billImport(wb,fname,rep);
  var cl=parseClientSheets(wb,hasBill?billSheets:null);
  if(cl.list.length){mergeClients(cl.list,rep);rep.info=rep.info.concat(cl.info);if(rep.kind==="skip")rep.kind="clients"}
  return rep;
}
var IMPORTING=false,LAST_REPS=[];
function importFiles(files){
  if(IMPORTING)return toast("Подождите — идёт загрузка");
  if(!can("imp"))return toast("Нет права загружать файлы");
  files=Array.prototype.slice.call(files||[]);if(!files.length)return;
  IMPORTING=true;snap("загрузка "+files.length+" "+plural(files.length,"файла","файлов","файлов"));
  var reps=[],left=files.length;
  $$("[data-imp-status]").forEach(function(e){e.textContent="Читаю "+files.length+" "+plural(files.length,"файл","файла","файлов")+"…"});
  files.forEach(function(f){
    var rd=new FileReader();
    rd.onload=function(e){setTimeout(function(){
      try{reps.push(importBook(readBook(e.target.result,f.name),f.name))}
      catch(err){console.warn(err);reps.push({name:f.name,kind:"skip",codes:{},info:[]})}
      if(--left===0)done();
    },0)};
    rd.onerror=function(){reps.push({name:f.name,kind:"skip",codes:{},info:[]});if(--left===0)done()};
    rd.readAsArrayBuffer(f);
  });
  function done(){
    IMPORTING=false;LAST_REPS=reps;save();logAct("Загрузка: "+files.map(function(f){return f.name}).join(", "));
    var n=sum(reps,function(r){return r.n}),c=sum(reps,function(r){return r.cliNew});
    renderAll();go("bills");
    toast("Готово: +"+n+" "+plural(n,"накладная","накладные","накладных")+(c?", +"+c+" "+plural(c,"клиент","клиента","клиентов"):""),undo);
  }
}

  a.push([]);a.push(["ОПЛАТЫ"]);a.push(["Дата","Сумма, сом","Способ / комментарий"]);
  P.forEach(function(f){a.push([dmy(f.d),Math.round(+f.s||0),[f.c,f.n].filter(Boolean).join(" · ")])});

var PAGES={},CUR="";
function page(id,title,glyph,crumb,render){PAGES[id]={t:title,z:glyph,c:crumb,r:render}}
function allowed(id){var it=null;NAV.forEach(function(g){g.items.forEach(function(x){if(x[0]===id)it=x})});return it&&(!it[3]||can(it[3]))}
function firstPage(){return allowed("dash")?"dash":(allowed("issue")?"issue":"cargo")}
function buildNav(){
  $("navs").innerHTML=NAV.map(function(g){
    var its=g.items.filter(function(x){return !x[3]||can(x[3])});if(!its.length)return "";
    return '<div class="navg"><div class="navh">'+g.g+'</div>'+its.map(function(x){
      return '<button class="nav" data-go="'+x[0]+'">'+ic(x[2])+'<span>'+x[1]+'</span><span class="cnt" id="n_'+x[0]+'"></span></button>'}).join("")+'</div>'}).join("")+
    '<span class="chip synchip" style="align-self:flex-start;margin-left:10px" data-go="settings"><i></i><span>—</span></span>';
  $("pages").innerHTML=Object.keys(PAGES).map(function(id){return '<section class="page" id="p_'+id+'"></section>'}).join("");
}
function go(id){
  if(!PAGES[id]||!allowed(id))id=firstPage();
  CUR=id;$$(".page").forEach(function(p){p.classList.toggle("on",p.id==="p_"+id)});
  $$(".nav").forEach(function(b){b.classList.toggle("on",b.dataset.go===id)});
  $("side").classList.remove("on");renderPage(id);window.scrollTo(0,0);
  if(id!=="cargo")$("bulk").classList.remove("on");
}
function head(id,extra){var P=PAGES[id];
  return '<div class="top"><div><div class="crumb">'+esc(P.c)+'</div><h1>'+esc(P.t)+'</h1></div><div class="row r">'+(extra||"")+'</div></div>'}
function renderPage(id){
  var el=$("p_"+id);if(!el)return;
  calc();
  try{PAGES[id].r(el)}catch(e){console.error(e);el.innerHTML=head(id)+'<div class="card">'+emptyBox("bill","Не удалось показать страницу",esc(e.message))+'</div>'}
}
function renderAll(){
  if(!ME)return;calc();counters();
  if(CUR)renderPage(CUR);
  if(DRAWER&&$("drawer").classList.contains("on"))reopenDrawer();
}
function counters(){
  var set=function(id,n,hot){var e=$("n_"+id);if(e){e.textContent=n||"";e.classList.toggle("hot",!!hot&&n>0)}};
  set("cargo",S.cargo.filter(function(c){return c.st!=="Выдан"}).length);
  set("issue",S.cargo.filter(function(c){return c.st==="В Бишкеке"}).length);
  set("intake",S.cargo.filter(function(c){return c.st==="В пути"||c.st==="Граница"}).length);
  set("cash",S.pays.filter(function(p){return p.st==="Запрос"}).length,true);
  set("clients",S.clients.filter(function(c){return c.type!=="agent"&&c.type!=="own"}).length);
  set("agents",S.clients.filter(function(c){return c.type==="agent"}).length);
  set("trips",S.trips.filter(function(t){return t.st!=="Выдан"&&t.st!=="В Бишкеке"}).length);
}

function chartBlock(M,C){
  var ms=[],d=new Date();for(var i=5;i>=0;i--){var x=new Date(d.getFullYear(),d.getMonth()-i,1);ms.push(x.getFullYear()+"-"+pad(x.getMonth()+1))}
  var data=ms.map(function(m){var L=S.cargo.filter(function(c){return ymOf(c.date)===m});
    return {m:m,kg:sum(L,function(c){return c.w}),rev:sum(L,function(c){return c._rev}),prof:sum(L,function(c){return c._prof}),n:L.length}});
  var key=M?(C?"prof":"rev"):"kg",mx=Math.max.apply(null,data.map(function(x){return x[key]}).concat([1]));
  var lab=key==="prof"?"Прибыль по месяцам, $":(key==="rev"?"Выставлено по месяцам, $":"Вес по месяцам, кг");
  return '<div class="ch"><div><h3>'+lab+'</h3><div class="cs">по дате отправки из Китая · последние 6 месяцев</div></div></div><div class="bars">'+data.map(function(x){
    var v=x[key],hgt=Math.max(2,Math.round(Math.max(0,v)/mx*130));
    return '<div class="b"><span class="val">'+(key==="kg"?fmt(v):fmt(v))+'</span><div class="s" style="height:'+hgt+'px"><i style="height:100%;background:'+(x.m===today().slice(0,7)?"var(--acc)":"color-mix(in srgb,var(--acc) 45%,var(--paper))")+'"></i></div><span class="lab">'+MONTHS[+x.m.slice(5)-1]+'</span></div>'}).join("")+'</div>';
}

/* ================= НАКЛАДНАЯ В WHATSAPP =================
   Картинка-счёт по выбранным накладным. При отправке сумма в сомах фиксируется по текущему курсу. */
function toSendList(code){
  var L=S.cargo.filter(function(c){return c.code===code&&c.st!=="Выдан"&&!c.sentAt});
  var bk=L.filter(function(c){return c.st==="В Бишкеке"});
  return (bk.length?bk:L);
}
function sendForCode(code){var L=toSendList(code);
  if(!L.length)L=S.cargo.filter(function(c){return c.code===code&&c.st!=="Выдан"});
  if(!L.length)return toast("У "+code+" нет накладных к отправке");
  sendQueue([{code:code,ids:L.map(function(c){return c.id})}])}
var SQ=[];
function sendQueue(list){SQ=list.slice();nextSend()}
function nextSend(){
  var it=SQ.shift();if(!it){closeModal();return}
  calc();var k=cliOf(it.code)||{code:it.code},pick={};it.ids.forEach(function(id){pick[id]=1});
  var all=S.cargo.filter(function(c){return c.code===it.code&&c.st!=="Выдан"}).sort(by(function(c){return c.date+c.wb}));
  it.ids.forEach(function(id){var c=find("cargo",id);if(c&&all.indexOf(c)<0)all.push(c)});
  function draw(){
    var L=all.filter(function(c){return pick[c.id]});
    modal('<div class="row"><h3 style="margin:0">Накладная · '+esc(it.code)+'</h3><span class="mut r" style="font-size:12px">'+(SQ.length?"ещё "+SQ.length+" в очереди":"")+'</span></div>'+
      '<div class="mut" style="font-size:13px;margin:4px 0 10px">'+esc(k.name||"")+(k.phone?' · '+esc(k.phone):' · <b style="color:var(--red)">нет телефона</b>')+'</div>'+
      '<div style="max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 10px;margin-bottom:10px">'+all.map(function(c){
        return '<label class="row" style="padding:5px 0;font-size:13px;border-bottom:1px solid var(--line)"><input type="checkbox" data-pk="'+esc(c.id)+'"'+(pick[c.id]?" checked":"")+'><span class="mono" style="font-size:12px">'+esc(c.wb)+'</span><span class="mut">'+c.pcs+' м · '+f1(c.w)+' кг</span><b class="r mono">'+usd(c._rev)+'</b>'+(c.sentAt?'<span class="tag jade">отпр.</span>':'')+'</label>'}).join("")+'</div>'+
      '<img id="invImg" style="width:100%;border-radius:10px;border:1px solid var(--line)">'+
      '<div class="row" style="margin-top:12px"><button class="btn g" id="invSkip">'+(SQ.length?"Пропустить":"Закрыть")+'</button><button class="btn g" id="invDl">'+ic("dl")+'Картинка</button><button class="btn wa r" id="invGo"'+(L.length?"":" disabled")+'>'+ic("wa")+'Отправить</button></div>');
    $$("[data-pk]").forEach(function(b){b.onchange=function(){if(b.checked)pick[b.dataset.pk]=1;else delete pick[b.dataset.pk];draw()}});
    var cv=invoiceCanvas(it.code,L);$("invImg").src=cv.toDataURL("image/jpeg",.9);
    $("invSkip").onclick=function(){nextSend()};
    $("invDl").onclick=function(){cv.toBlob(function(b){download("nakladnaya-"+it.code+"-"+today()+".jpg",b)},"image/jpeg",.92)};
    $("invGo").onclick=function(){
      cv.toBlob(async function(blob){
        var file=new File([blob],"SRB-"+it.code+"-"+today()+".jpg",{type:"image/jpeg"}),text=invText(it.code,L),shared=false;
        if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:text});shared=true}catch(e){if(e.name==="AbortError")return}}
        if(!shared){download(file.name,blob);if(k.phone)window.open("https://wa.me/"+waNum(k.phone)+"?text="+encodeURIComponent(text),"_blank");else toast("Картинка скачана. Телефона нет — отправьте вручную")}
        var t=nowISO(),rate=+S.cfg.usd;
        L.forEach(function(c){if(!c.sentAt)upd("cargo",c,{sentAt:t,sentRate:rate,sentUsd:r2(c._rev),sentSom:Math.round(c._rev*rate)},true)});
        save();logAct("Накладная "+it.code+": "+L.length+" накл.");renderAll();toast("Отмечено: накладная отправлена "+it.code);nextSend();
      },"image/jpeg",.92);
    };
  }
  draw();
}
function invText(code,L){
  var k=cliOf(code)||{},b=bal(code),tot=Math.round(sum(L,function(c){return c.sentAt?c._som:Math.round(c._rev*S.cfg.usd)}));
  var prev=Math.round(b.debt)-sum(L.filter(function(c){return c.sentAt}),function(c){return c._som-c._paid});
  return "Здравствуйте"+(k.name?", "+k.name:"")+"!\nSRB CARGO — накладная по коду "+code+"\n"+L.map(function(c,i){return (i+1)+") "+c.wb+" — "+c.pcs+" м, "+f1(c.w)+" кг — "+usd(c._rev)}).join("\n")+
    "\n\nК оплате: "+fmt(tot)+" сом ($"+f2(sum(L,function(c){return c._rev}))+", курс "+S.cfg.usd+")"+(prev>0?"\nПрошлый долг: "+fmt(prev)+" сом":"")+
    (L.some(function(c){return c.st==="В Бишкеке"})?"\n\nГруз ждёт вас на складе в Бишкеке.":"")+(S.cfg.wa.pay?"\n"+S.cfg.wa.pay:"");
}
function invoiceCanvas(code,L){
  var k=cliOf(code)||{},W=1080,rowH=58,H=520+Math.max(1,L.length)*rowH+170,cv=document.createElement("canvas"),x=cv.getContext("2d");
  cv.width=W;cv.height=H;
  var ink="#14161c",red="#12805C",mut="#6c7180",line="#e1e9e4",F="Onest, Arial, sans-serif",FD="Onest, Arial, sans-serif",FM="JetBrains Mono, Consolas, monospace";
  x.fillStyle="#eef4f0";x.fillRect(0,0,W,H);x.fillStyle="#fff";rr(x,30,30,W-60,H-60,28);x.fill();
  x.fillStyle=red;rr(x,70,70,84,84,16);x.fill();
  x.fillStyle="#fff";x.font="700 22px "+FD;x.textAlign="center";x.fillText("SRB",112,121);x.textAlign="left";
  x.fillStyle=ink;x.font="700 32px "+FD;x.fillText("SRB CARGO",176,108);x.fillStyle=mut;x.font="600 20px "+F;x.fillText("Китай → Бишкек · накладная от "+dmy(today()),176,142);
  x.fillStyle="#f1f7f3";rr(x,70,190,W-140,120,18);x.fill();
  x.fillStyle=mut;x.font="700 17px "+F;x.fillText("КЛИЕНТ",100,228);x.fillText("ВЕС / МЕСТ",620,228);
  x.fillStyle=ink;x.font="700 34px "+FD;x.fillText(code,100,276);x.font="600 22px "+F;x.fillStyle=mut;x.fillText(String(k.name||"").slice(0,24),100+x.measureText(code).width*1.55+20,276);
  x.fillStyle=ink;x.font="700 30px "+FM;x.fillText(f1(sum(L,function(c){return c.w}))+" кг · "+sum(L,function(c){return c.pcs})+" м",620,276);
  var y=360,cols=[100,560,690,840,930];
  x.fillStyle=mut;x.font="700 16px "+F;["НАКЛАДНАЯ","МЕСТ","КГ","ЦЕНА","СУММА $"].forEach(function(h,i){x.textAlign=i?"right":"left";x.fillText(h,i?cols[i]+(i===4?50:0):cols[i],y)});
  y+=18;x.strokeStyle=line;x.lineWidth=2;x.beginPath();x.moveTo(100,y);x.lineTo(W-100,y);x.stroke();
  L.forEach(function(c){y+=rowH;x.textAlign="left";x.fillStyle=ink;x.font="600 21px "+FM;var wb=String(c.wb);while(x.measureText(wb).width>400)wb=wb.slice(0,-2);x.fillText(wb,100,y-18);
    x.fillStyle=mut;x.font="500 15px "+F;x.fillText((c._ag&&whoOf(c)?whoOf(c)+" · ":"")+dmy(c.date)+" · "+c.st,100,y+2);
    x.textAlign="right";x.fillStyle=ink;x.font="600 21px "+FM;x.fillText(String(c.pcs),cols[1],y-10);x.fillText(f1(c.w),cols[2],y-10);
    x.font="600 18px "+FM;x.fillText("$"+f2(c._rate)+"/"+c._unit,cols[3],y-10);x.font="700 22px "+FM;x.fillText(f2(c._rev),cols[4]+50,y-10);
    x.strokeStyle=line;x.lineWidth=1;x.beginPath();x.moveTo(100,y+16);x.lineTo(W-100,y+16);x.stroke()});
  y+=70;var tUsd=sum(L,function(c){return c._rev}),tSom=Math.round(sum(L,function(c){return c.sentAt?c._som:Math.round(c._rev*S.cfg.usd)}));
  x.fillStyle="#0d5c43";rr(x,70,y-40,W-140,130,20);x.fill();
  x.fillStyle="#a7d8c2";x.font="700 17px "+F;x.textAlign="left";x.fillText("К ОПЛАТЕ",104,y);x.fillText("$"+f2(tUsd)+" · курс "+S.cfg.usd,104,y+64);
  x.fillStyle="#fff";x.font="700 48px "+FD;x.textAlign="right";x.fillText(fmt(tSom)+" сом",W-104,y+52);
  y+=140;x.textAlign="left";x.fillStyle=mut;x.font="500 18px "+F;
  if(S.cfg.wa.pay){x.fillText(String(S.cfg.wa.pay).slice(0,80),100,y);y+=30}
  x.fillText(String(S.cfg.wa.footer||"SRB CARGO").slice(0,80),100,y);
  return cv;
  function rr(c,a,b,w,h,r){c.beginPath();c.moveTo(a+r,b);c.arcTo(a+w,b,a+w,b+h,r);c.arcTo(a+w,b+h,a,b+h,r);c.arcTo(a,b+h,a,b,r);c.arcTo(a,b,a+w,b,r);c.closePath()}
}

/* ================= КАЛЬКУЛЯТОР ДОСТАВКИ =================
   Цена для клиента = ставка из таблицы себестоимости (по классу и плотности) + наценка калькулятора.
   Плотный груз — за кг, лёгкий (ниже нижней ступени таблицы) — за м³. */
var CALC={cat:1,w:"",m3:"",box:false,l:"",wd:"",h:"",n:""};
function calcQuote(){
  var w=+CALC.w||0,m3=CALC.box?((+CALC.l||0)*(+CALC.wd||0)*(+CALC.h||0)*(+CALC.n||0)/1e6):(+CALC.m3||0),d=m3>0?w/m3:0;
  var T=tier(CALC.cat,d||9999),mkK=+S.cfg.calcMk||0,mkM=+S.cfg.calcMkM||0;
  var rate=T.unit==="м³"?T.rate+mkM:T.rate+mkK,q=T.unit==="м³"?m3:w;
  return {w:w,m3:m3,d:d,unit:T.unit,rate:rate,cost:T.rate,total:q*rate,costTotal:q*T.rate};
}
function calcHTML(staff){
  var r=calcQuote(),pos=Math.min(100,Math.max(0,r.d/1000*100));
  return '<div class="calc"><div class="card" style="margin:0"><div class="ch"><div><h3>Что везём</h3><div class="cs">Класс груза влияет на тариф</div></div></div>'+
    '<div class="cls">'+[1,2,3,4,5,6].map(function(n){var t=CLS_NAMES[n].split(" · ");return '<button data-ccat="'+n+'" class="'+(CALC.cat===n?"on":"")+'"><b>'+n+' · '+t[0]+'</b><span>'+esc(t[1])+'</span></button>'}).join("")+'</div>'+
    '<div class="grid g2" style="margin-top:16px"><div class="fld"><label>Вес, кг</label><input data-cv="w" type="number" inputmode="decimal" value="'+esc(CALC.w)+'" placeholder="например 500"></div>'+
    (CALC.box?'<div class="fld"><label>Объём, м³ (посчитан)</label><input disabled value="'+(r.m3?r.m3.toFixed(3):"")+'"></div>':'<div class="fld"><label>Объём, м³</label><input data-cv="m3" type="number" inputmode="decimal" step="0.01" value="'+esc(CALC.m3)+'" placeholder="например 2.5"></div>')+'</div>'+
    '<label class="row" style="margin-top:12px;font-size:13px;font-weight:600;cursor:pointer"><input type="checkbox" id="cBox"'+(CALC.box?" checked":"")+'>Не знаю объём — посчитать по коробке</label>'+
    (CALC.box?'<div class="grid g4" style="margin-top:10px"><div class="fld"><label>Длина, см</label><input data-cv="l" type="number" value="'+esc(CALC.l)+'"></div><div class="fld"><label>Ширина, см</label><input data-cv="wd" type="number" value="'+esc(CALC.wd)+'"></div><div class="fld"><label>Высота, см</label><input data-cv="h" type="number" value="'+esc(CALC.h)+'"></div><div class="fld"><label>Коробок</label><input data-cv="n" type="number" value="'+esc(CALC.n)+'"></div></div>':'')+
    '<div style="margin-top:18px"><div class="row" style="font-size:12px;font-weight:700;color:var(--ink3)"><span>лёгкий</span><span class="r">плотный</span></div><div class="meter"><i style="left:'+pos+'%"></i></div>'+
    '<div class="mut" style="font-size:12.5px">Плотность: <b style="color:var(--ink)">'+(r.d?Math.round(r.d)+" кг/м³":"—")+'</b>'+(r.d&&r.unit==="м³"?" · лёгкий груз считается за кубометр":"")+'</div></div></div>'+
    '<div class="card" style="margin:0;background:var(--ink);color:#f1efe9;border:0"><div class="mut2" style="font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase">Стоимость доставки до Бишкека</div>'+
    '<div class="price" style="margin:14px 0 6px;color:#fff">'+(r.total?"$"+fmt(r.total,0):"—")+'<small style="color:#9a988f"> '+(r.total?"≈ "+fmt(r.total*S.cfg.usd)+" сом":"")+'</small></div>'+
    '<div style="color:#bdbab2;font-size:13.5px">'+(r.total?"Тариф $"+f2(r.rate)+" за "+r.unit+" · класс "+CALC.cat:"Введите вес и объём")+'</div>'+
    (r.w&&r.w<100?'<div class="tag amber" style="margin-top:12px">Минимальная отправка — от 100 кг</div>':'')+
    (staff&&can("cost")&&r.total?'<div style="margin-top:14px;padding-top:12px;border-top:1px solid #33353c;font-size:13px;color:#bdbab2">Себестоимость $'+fmt(r.costTotal,2)+' · ваша прибыль <b style="color:#2fbf8c">$'+fmt(r.total-r.costTotal,2)+'</b></div>':'')+
    '<a class="btn wa" style="margin-top:20px;width:100%;padding:13px" target="_blank" id="cWa" href="'+(S.cfg.wa.phone?"https://wa.me/"+waNum(S.cfg.wa.phone)+"?text="+encodeURIComponent(calcText(r)):"#")+'">'+ic("wa")+(staff?"Отправить расчёт клиенту":"Отправить расчёт в WhatsApp")+'</a>'+

}
function calcText(r){return "Здравствуйте! Расчёт доставки SRB CARGO:\nКласс "+CALC.cat+" ("+CLS_NAMES[CALC.cat].split(" · ")[1]+")\nВес "+fmt(r.w)+" кг, объём "+(r.m3?r.m3.toFixed(2):"?")+" м³, плотность "+Math.round(r.d||0)+"\nТариф $"+f2(r.rate)+"/"+r.unit+"\nИтого ≈ $"+fmt(r.total,0)+" ("+fmt(r.total*S.cfg.usd)+" сом)"}
function bindCalc(root,staff,rerender){
  $$("[data-ccat]",root).forEach(function(b){b.onclick=function(){CALC.cat=+b.dataset.ccat;rerender()}});
  $$("[data-cv]",root).forEach(function(i){i.oninput=debounce(function(){CALC[i.dataset.cv]=i.value;var k=i.dataset.cv;rerender();var n=root.querySelector('[data-cv="'+k+'"]');if(n)n.focus()},400)});
  var cb=root.querySelector("#cBox");if(cb)cb.onchange=function(){CALC.box=cb.checked;rerender()};
  var wa=root.querySelector("#cWa");if(wa&&!S.cfg.wa.phone)wa.onclick=function(e){e.preventDefault();var r=calcQuote();
    if(staff){var t=calcText(r);if(navigator.clipboard)navigator.clipboard.writeText(t);toast("Расчёт скопирован — вставьте клиенту в WhatsApp")}else toast("Номер WhatsApp компании не указан")};
}

  if($("gsTok"))$("gsTok").onclick=function(){modal('<h3>Главный токен</h3><div class="mut" style="margin:6px 0 12px">В Google Таблице: меню «SRB CARGO» → «Показать ссылку и токен».</div><div class="fld"><input id="tk" placeholder="srb-…"></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn g" onclick="closeModal()">Отмена</button><button class="btn pri" id="tkOk">Подключить</button></div>',ok);
    $("tkOk").onclick=ok;function ok(){var t=$("tk").value.trim();if(!t)return;S.gs.token=t;ME.master=true;save(true);closeModal();sync(false)}};
  if($("gsUrl"))$("gsUrl").onclick=function(){modal('<h3>Ссылка на скрипт</h3><div class="fld" style="margin-top:12px"><input id="gu" value="'+esc(S.gs.url)+'"></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn g" onclick="closeModal()">Отмена</button><button class="btn pri" id="guOk">Сохранить</button></div>',ok);
    $("guOk").onclick=ok;function ok(){S.gs.url=$("gu").value.trim();save(true);closeModal();renderPage("settings");sync(false)}};
  if($("uNew"))$("uNew").onclick=function(){userModal(-1)};
  $$("[data-uedit]",el).forEach(function(b){b.onclick=function(){userModal(+b.dataset.uedit)}});
  $("bkSave").onclick=backupJSON;
  if($("bkLoad"))$("bkLoad").onclick=function(){$("restorePick").click()};
  if($("wipe"))$("wipe").onclick=async function(){if(!await ask("Очистить всё на этом устройстве?","Данные в Google Таблице останутся — при следующем входе загрузятся заново.","Очистить",true))return;
    localStorage.removeItem(STORE);location.reload()};
});
$("restorePick").onchange=function(){var f=this.files[0];this.value="";if(!f)return;var r=new FileReader();r.onload=async function(){
  try{var d=JSON.parse(r.result);if(!d.cargo||!d.cfg)throw 0;if(!await ask("Восстановить копию?",d.cargo.length+" накладных, "+(d.clients||[]).length+" клиентов. Текущие данные на этом устройстве заменятся.","Восстановить",true))return;
    var gs=S.gs,t=nowISO();snap("восстановление");["clients","cargo","fin","trips","pays","files"].forEach(function(k){S[k]=(d[k]||[]).map(function(o){o.u=t;o.uf=o.uf||{};Object.keys(o).forEach(function(f){if(f!=="u"&&f!=="uf"&&f[0]!=="_")o.uf[f]=t});return o})});
    S.cfg=Object.assign(S.cfg,d.cfg,{users:S.cfg.users});S.gs=gs;cfgTouch();renderAll();toast("Копия восстановлена",undo)}catch(e){toast("Это не резервная копия SRB CARGO")}};r.readAsText(f)};
function userModal(i){
  var u=i>-1?S.cfg.users[i]:{login:"",n:"",r:"manager",p:ROLES.manager.p.slice()},own=u.r==="owner",p=permsFix(u);
  modal('<h3>'+(i>-1?"Сотрудник":"Новый сотрудник")+'</h3><div class="col" style="margin-top:12px"><div class="grid g2"><div class="fld"><label>Имя</label><input id="uN" value="'+esc(u.n)+'"></div><div class="fld"><label>Логин</label><input id="uL" value="'+esc(u.login)+'"'+(i>-1?" disabled":"")+'></div></div>'+
    (own?'':'<div class="fld"><label>Роль</label><select id="uR">'+Object.keys(ROLES).filter(function(k){return k!=="owner"}).map(function(k){return '<option value="'+k+'"'+(u.r===k?" selected":"")+'>'+ROLES[k].n+'</option>'}).join("")+'</select></div>'+
    '<div class="col" style="gap:4px" id="uP">'+RIGHTS.map(function(r){return '<label class="row" style="font-size:13.5px;cursor:pointer"><input type="checkbox" value="'+r[0]+'"'+(p.indexOf(r[0])>-1?" checked":"")+'>'+r[1]+'</label>'}).join("")+'</div>')+
    '<div class="fld"><label>'+(i>-1?"Новый пароль (пусто — не менять)":"Пароль")+'</label><input id="uPw" type="text" autocomplete="off"></div><div class="err" id="uE"></div>'+
    '<div class="row">'+(i>-1&&!own?'<button class="btn g" id="uDel" style="color:var(--red)">Удалить</button>':'')+'<button class="btn g r" onclick="closeModal()">Отмена</button><button class="btn pri" id="uOk">Сохранить</button></div></div>');
  if($("uR"))$("uR").onchange=function(){var pr=ROLES[this.value].p;$$("#uP input").forEach(function(c){c.checked=pr.indexOf(c.value)>-1})};
  $("uOk").onclick=async function(){
    var n=$("uN").value.trim(),l=$("uL").value.trim().toLowerCase(),pw=$("uPw").value;
    if(!n||!l)return $("uE").textContent="Имя и логин обязательны";
    if(i<0&&S.cfg.users.some(function(x){return x.login===l}))return $("uE").textContent="Такой логин уже есть";
    if(i<0&&pw.length<4)return $("uE").textContent="Пароль — от 4 символов";
    var o=i>-1?u:{login:l};o.n=n;if(!own){o.r=$("uR").value;o.p=$$("#uP input").filter(function(c){return c.checked}).map(function(c){return c.value})}
    if(pw)o.ph=await userHash(l,pw);if(i<0)S.cfg.users.push(o);
    cfgTouch();closeModal();renderPage("settings");toast("Сохранено"+(pw?". Передайте сотруднику логин «"+l+"» и пароль":""));
  };
  if($("uDel"))$("uDel").onclick=async function(){closeModal();if(!await ask("Удалить сотрудника "+u.n+"?","Он сразу потеряет доступ.","Удалить",true))return;S.cfg.users.splice(i,1);cfgTouch();renderPage("settings")};
}

/* ================= ЛИЧНЫЙ КАБИНЕТ КЛИЕНТА / АГЕНТА ================= */
var CABQ="";
function cabData(){
  var r=CAB.remote;
  if(r)return {name:(r.client&&r.client.name)||"",type:(r.client&&r.client.type)||"",acc:+r.acc||0,paid:+r.paid||0,pays:r.pays||[],
    cargo:(r.cargo||[]).map(function(x){return {wb:String(x.wb||x.id),pcs:+x.pcs||0,w:+x.w||0,m3:+x.m3||0,date:String(x.date||"").slice(0,10),st:stNorm(x.st),
      sent:!!x.sentAt,som:+x.som||0,usd:+x.usd||0,pay:x.payst||"",sub:x.sub||"",subName:x.subName||"",issuedAt:x.issuedAt||""}})};
  calc();var k=cliOf(CAB.code)||{},b=bal(CAB.code);
  return {name:k.name||"",type:k.type||"",acc:b.acc,paid:b.paid,pays:S.pays.filter(function(p){return p.code===CAB.code}),
    cargo:S.cargo.filter(function(c){return c.code===CAB.code}).map(function(c){return {wb:c.wb,pcs:c.pcs,w:c.w,m3:c.m3,date:c.date,st:c.st,sent:!!c.sentAt,som:c._som,usd:c._rev,pay:c._pay,sub:c.sub,subName:c.subName,issuedAt:c.issuedAt}})};
}
function openCab(){
  $("login").classList.add("hide");$("cabw").classList.remove("hide");renderCab();
}
function renderCab(){
  var D=cabData(),ag=D.type==="agent"||D.cargo.some(function(x){return x.sub||x.subName}),debt=D.acc-D.paid,q=CABQ.trim().toUpperCase();
  var who=function(x){return ((x.sub||"")+(x.subName&&x.subName!==x.sub?" "+x.subName:"")).trim()};
  var L=D.cargo.filter(function(x){return !q||(x.wb+" "+who(x)).toUpperCase().indexOf(q)>-1}).sort(by(function(x){return x.date},true));
  var cnt=function(f){return D.cargo.filter(f).length};
  var h='<div class="row" style="margin-bottom:18px"><div class="brand"><div class="seal">SRB</div><div><b>'+esc(D.name||CAB.code)+'</b><small>'+(ag?"агент":"клиент")+' · код '+esc(CAB.code)+'</small></div></div>'+
    '<div class="row r"><button class="btn g sm" id="cabXl">'+ic("dl")+'Excel</button><button class="btn g sm" id="cabOut">Выйти</button></div></div>';
  h+='<div class="kpis"><div class="kpi '+(debt>0.5?"red":"jade")+'"><div class="l">'+(debt>=0?"К оплате":"Ваш аванс")+'</div><div class="v">'+fmt(Math.abs(debt))+'<small>сом</small></div><div class="d">по выставленным накладным</div></div>'+
    '<div class="kpi"><div class="l">В пути</div><div class="v">'+cnt(function(x){return x.st!=="В Бишкеке"&&x.st!=="Выдан"})+'</div><div class="d">накладных</div></div>'+
    '<div class="kpi jade"><div class="l">Ждёт на складе</div><div class="v">'+cnt(function(x){return x.st==="В Бишкеке"})+'</div><div class="d">можно забирать</div></div>'+
    '<div class="kpi"><div class="l">Получено</div><div class="v">'+cnt(function(x){return x.st==="Выдан"})+'</div><div class="d">накладных</div></div></div>';
  if(ag){var R={};D.cargo.forEach(function(x){var k=who(x)||"без клиента",r=R[k]||(R[k]={n:0,kg:0,usd:0,bk:0,iss:0});r.n++;r.kg+=x.w;r.usd+=x.usd;if(x.st==="В Бишкеке")r.bk++;if(x.st==="Выдан")r.iss++});
    h+='<div class="card"><div class="ch"><div><h3>Мои клиенты</h3><div class="cs">Сумма — по агентской цене (что вы платите SRB CARGO). Нажмите — покажу накладные клиента</div></div></div><div class="tw"><table><thead><tr><th>Клиент</th><th class="num">Накл.</th><th class="num">Кг</th><th class="num">Сумма $</th><th class="num">На складе</th><th class="num">Выдано</th></tr></thead><tbody>'+
      Object.keys(R).sort(by(function(k){return -R[k].usd})).map(function(k){var r=R[k];return '<tr class="click" data-cabsub="'+esc(k)+'"><td><b>'+esc(k)+'</b></td><td class="num">'+r.n+'</td><td class="num">'+fmt(r.kg)+'</td><td class="num">'+f2(r.usd)+'</td><td class="num">'+(r.bk||"")+'</td><td class="num">'+(r.iss||"")+'</td></tr>'}).join("")+'</tbody></table></div></div>'}
  h+='<div class="card"><div class="ch"><div><h3>Мои грузы</h3><div class="cs">'+D.cargo.length+' накладных · '+fmt(sum(D.cargo,function(x){return x.w}))+' кг</div></div><div class="search r">'+ic("search")+'<input id="cabQ" placeholder="Накладная'+(ag?", клиент":"")+'" value="'+esc(CABQ)+'"></div></div>'+
    (L.map(function(x){return '<div class="parcel"><div style="flex:1;min-width:200px"><b class="mono" style="font-size:13px">'+esc(x.wb)+'</b><div class="mut" style="font-size:12.5px">'+(ag&&who(x)?'<b style="color:var(--ink)">'+esc(who(x))+'</b> · ':'')+x.pcs+' мест · '+f1(x.w)+' кг · '+dmy(x.date)+(x.issuedAt?' · получен '+dmy(localISO(x.issuedAt)):'')+'</div></div>'+
      '<div>'+route(x.st)+'<span class="stl">'+esc(x.st)+'</span></div><div style="min-width:120px;text-align:right">'+(x.sent?'<b class="mono">'+fmt(x.som)+' сом</b><div>'+(PAY_TAG[x.pay||"no"]||"")+'</div>':'<span class="mut" style="font-size:12px">счёт ещё не выставлен</span>')+'</div></div>'}).join("")||emptyBox("box",q?"Ничего не найдено":"Грузов пока нет",""))+'</div>';
  h+='<div class="card"><div class="ch"><div><h3>Я оплатил</h3><div class="cs">Сообщите об оплате — менеджер проверит и подтвердит</div></div></div><div class="grid g3"><div class="fld"><label>Сумма, сом</label><input id="cabS" type="number" inputmode="numeric"></div>'+
    '<div class="fld"><label>Как оплатили</label><select id="cabM">'+PAY_METHODS.map(function(m){return '<option>'+m+'</option>'}).join("")+'</select></div><div class="fld"><label>Комментарий</label><input id="cabN"></div></div>'+
    '<button class="btn pri" id="cabSend" style="margin-top:12px">Отправить</button>'+
    (D.pays.length?'<div style="margin-top:12px">'+D.pays.slice().sort(by(function(p){return p.created},true)).map(function(p){return '<div class="todo"><div class="gl '+(p.st==="Подтверждена"?"jade":(p.st==="Отклонена"?"red":"amber"))+'">'+(p.st==="Подтверждена"?"✓":(p.st==="Отклонена"?"×":"…"))+'</div><div style="flex:1"><b>'+fmt(p.sum)+' сом</b><div class="mut" style="font-size:12px">'+when(p.created)+' · '+esc(p.method||"")+'</div></div><span class="tag">'+esc(p.st==="Запрос"?"на проверке":p.st)+'</span></div>'}).join("")+'</div>':'')+'</div>';
  h+='<div class="row" style="justify-content:center;margin-top:20px"><button class="btn g sm" id="cabCalc">Рассчитать новую доставку</button></div>';
  $("cab").innerHTML=h;
  $("cabOut").onclick=logout;
  $("cabQ").oninput=debounce(function(){CABQ=this.value;renderCab();var i=$("cabQ");i.focus();i.setSelectionRange(i.value.length,i.value.length)},250);
  $$("[data-cabsub]").forEach(function(r){r.onclick=function(){CABQ=r.dataset.cabsub;renderCab();$("cabQ").scrollIntoView({block:"center",behavior:"smooth"})}});
  $("cabCalc").onclick=function(){$("cabw").classList.add("hide");openPubCalc();$("pubBack").onclick=function(){$("pubcalc").classList.add("hide");$("cabw").classList.remove("hide");$("pubBack").onclick=function(){$("pubcalc").classList.add("hide");$("login").classList.remove("hide")}}};
  $("cabXl").onclick=function(){xlsxSave("srb-"+CAB.code+"-"+today()+".xlsx",[{name:CAB.code,aoa:[["SRB CARGO · "+CAB.code+(D.name?" · "+D.name:"")+" · "+dmy(today())],[],["Накладная",ag?"Клиент":"","Мест","Кг","М³","Дата","Статус","Сумма $","Сумма, сом","Оплата"]].concat(D.cargo.map(function(x){
    return [x.wb,ag?who(x):"",x.pcs,x.w,x.m3,dmy(x.date),x.st,x.usd?r2(x.usd):"",x.sent?Math.round(x.som):"",x.sent?{ok:"оплачено",part:"частично",no:"не оплачено"}[x.pay||"no"]:"не выставлен"]})),cols:[28,16,6,9,8,11,11,10,11,12]}])};
  $("cabSend").onclick=async function(){
    var s=Math.round(+$("cabS").value||0);if(!(s>0))return toast("Укажите сумму");
    var b=this;b.disabled=true;
    try{
      if(CAB.remote){var j=await gsPost({action:"payreq",code:CAB.code,ph:CAB.ph,sum:s,method:$("cabM").value,note:$("cabN").value.trim()});if(j.error)throw new Error(j.error);
        var j2=await gsPost({action:"client",code:CAB.code,ph:CAB.ph});if(j2.ok)CAB.remote=j2}
      else{add("pays",{id:uid("pr"),code:CAB.code,sum:s,usd:"",rate:"",method:$("cabM").value,note:$("cabN").value.trim(),st:"Запрос",created:nowISO(),by:"клиент",at:""})}
      toast("Спасибо! Менеджер проверит оплату");renderCab();
    }catch(e){toast(e.message);b.disabled=false}
  };
}

/* ================= ЗАПУСК ================= */
(function boot(){
  try{var th=localStorage.getItem("srb:theme");if(th)document.documentElement.dataset.theme=th;else if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark"}catch(e){}
  load();
  $("ver").textContent=VER;$("lgUrl").value=S.gs.url;
  $$("#lgSeg button").forEach(function(b){b.onclick=function(){setLgMode(b.dataset.m)}});
  $("lgGo").onclick=login;
  ["lgUser","lgPass"].forEach(function(i){$(i).addEventListener("keydown",function(e){if(e.key==="Enter")login()})});
  if(/[?&#]cab/.test(location.href))setLgMode("cab");
  if(/[?&#]calc/.test(location.href))openPubCalc();
  // та же вкладка после обновления страницы — без повторного входа
  try{var me=JSON.parse(sessionStorage.getItem("srb:me")||"null");
    if(me){var u=(S.cfg.users||[]).find(function(x){return String(x.login).toLowerCase()===String(me.login).toLowerCase()});if(u)enter(u,me.master?{master:true}:{})}}catch(e){}
  setInterval(function(){if(ME&&gsOn()&&!document.hidden)sync(true)},120000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden&&ME&&gsOn())sync(true)});
  window.addEventListener("online",function(){if(ME&&gsOn())sync(true)});
})();

</script>
